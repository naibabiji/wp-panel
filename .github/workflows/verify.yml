name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: |
          packages=$(go list ./... | grep -v '/scratch$')
          go test $packages

      - name: Vet
        run: |
          packages=$(go list ./... | grep -v '/scratch$')
          go vet $packages

      - name: Build
        run: go build .

      # Private development repository only; skipped where private-tools/ is absent.
      - name: Capability catalog and public AI facts
        if: hashFiles('private-tools/verify-capability-map.py') != ''
        run: |
          python3 private-tools/verify-capability-map.py --generate
          python3 -m unittest private-tools/test_verify_capability_map.py private-tools/test_check_public_ai_live.py
