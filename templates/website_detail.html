{{template "wp_anomaly_script" .}}
<script>
function websiteDetail() {
    return {
        site: null,
		maintenance: { state: 'unknown', window_id: '' },
		maintenanceEnabled: false,
		maintenanceMinutes: 5,
		maintenanceSaving: false,
		maintenancePasswordInput: '',
		maintenanceSecretError: false,
		async loadMaintenancePassword() {
			this.maintenancePasswordInput = ''; this.maintenanceSecretError = false;
			try {
				const r = await api('/websites/' + this.site.id + '/maintenance/password', {method:'POST', body:{}});
				this.maintenancePasswordInput = r.data.password;
			} catch (_) { this.maintenanceSecretError = true; }
		},
		async copyMaintenancePassword() {
			try { await navigator.clipboard.writeText(this.maintenancePasswordInput); showToast(t('maintenance.copied'), 'success'); }
			catch (_) { showToast(t('common.operation_failed'), 'error'); }
		},
		generateMaintenancePassword() {
			const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
			this.maintenancePasswordInput = Array.from(crypto.getRandomValues(new Uint8Array(16)), n => alphabet[n & 31]).join('');
		},
		maintenanceTimer: null,
		maintenanceStateText() {
			return ({ locked:t('maintenance.locked'), unlocked:t('maintenance.unlocked'), unlocked_permanent:t('maintenance.unlocked_permanent'), unlocking:t('maintenance.unlocking'), relocking:t('maintenance.relocking'), relock_failed:t('maintenance.relock_failed'), unknown:t('maintenance.unknown') })[this.maintenance.state] || t('maintenance.unknown');
		},
		async loadMaintenance(initial = false) {
			if (!this.site || this.site.site_type !== 'wordpress') return;
			try {
				const r = await api('/websites/' + this.site.id + '/maintenance');
				this.maintenance = r.data;
				if (r.data.state === 'locked') { this.site.file_lock_enabled = true; this.site.file_lock_apply_status = 'ready'; }
				else if (r.data.state === 'unlocked' || r.data.state === 'unlocked_permanent') { this.site.file_lock_enabled = false; this.site.file_lock_apply_status = ''; }
				else { this.site.file_lock_apply_status = r.data.state === 'relock_failed' ? 'failed' : 'applying'; }
				if (initial) { this.maintenanceEnabled = r.data.enabled; this.maintenanceMinutes = r.data.minutes; await this.loadMaintenancePassword(); }
			} catch (_) { this.maintenance.state = 'unknown'; }
		},
		async saveMaintenance() {
			if (this.maintenanceSaving) return;
			this.maintenanceSaving = true;
			const body = { enabled: this.maintenanceEnabled, minutes: this.maintenanceMinutes, password: this.maintenancePasswordInput };
			try {
				const r = await api('/websites/' + this.site.id + '/maintenance', {method:'PUT', body: JSON.stringify(body)});
				this.maintenance = r.data; showToast(t('common.saved'), 'success');
				await this.loadMaintenancePassword();
			} catch (error) { showToast(t(error.message === 'lock_mode_required' ? 'maintenance.lock_mode_required' : error.message === 'verification_failed' ? 'maintenance.invalid_configuration' : error.message === 'operation_unavailable' ? 'maintenance.operation_unavailable' : 'maintenance.state_unknown'), 'error'); }
			finally { delete body.password; this.maintenanceSaving = false; }
		},
		async relockMaintenance() {
			this.maintenanceSaving = true;
			try {
				await api('/websites/' + this.site.id + '/maintenance/relock', {method:'POST',body:JSON.stringify({window_id:this.maintenance.window_id})});
				await this.loadMaintenance(); await this.fetchDetail();
			} catch (_) { showToast(t('maintenance.state_unknown'), 'error'); await this.loadMaintenance(); }
			finally { this.maintenanceSaving = false; }
		},
		destroy() { if (this.maintenanceTimer) clearInterval(this.maintenanceTimer); },
        loading: true,
        sslModalOpen: false,
        sslMode: 'auto',
        sslCert: '',
        sslKey: '',
        sslSubmitting: false,
        sslExportEnabled: false,
        sslExportSaving: false,
        logType: 'access',
        logContent: '',
        logLineLimit: 200,
        logFiles: [],
        logFullscreen: false,
        nginxPreContent: '',
        nginxContent: '',
        nginxSubmitting: false,
        fcacheEnabled: false,
        fcacheTTL: 300,
        disableWPUpdates: false,
        savedDisableWPUpdates: false,
        disableFileEditing: false,
        savedDisableFileEditing: false,
        fileEditingSaving: false,
        passwordResetMode: 'allow',
        passwordResetSaving: false,
        xmlrpcEnabled: false,
        disableApplicationPasswords: false,
        wpDebug: false,
        wpDebugDisplay: false,
        wpPostRevisions: -1,
        wpMemoryLimit: '',
        logRetentionDays: 7,
        optimizationSaving: false,
        fileLockSaving: false,
        fileLockMode: 'standard',
        fileLockPreview: null,
        fileLockPreviewLoading: false,
        pluginStatus: 'unknown',
        pluginStatusLoading: false,
        pluginInstalling: false,
        monitoringEnabled: false,
        monitoringInterval: 5,
        monitoringSaving: false,
        documentRootSubdir: '',
        documentRootSaving: false,
        cdnGroups: [],
        cdnRealIPEnabled: false,
        cdnRealIPGroupIDs: [],
        cdnRealIPSaving: false,
        accessLogMode: 'off',
        expiresAtInput: '',
        editingExpiry: false,
        expirySaving: false,
        domainModalOpen: false,
        editDomain: '',
        editAliasesStr: '',
        domainSubmitting: false,
        syncWPSiteURLs: false,
        wpURLsLoading: false,
        wpSiteURL: '',
        wpHomeURL: '',
        wpURLsError: '',
        aiDevelopmentModalOpen: false,
        aiCredentialPackage: null,
        aiCredentialDownloaded: false,
        aiAccess: { loading: true, enabled: false, status: 'disabled', busy: false, stage: '', installWPCLI: true, installNodeJS: false, confirmDomain: '', tools: [] },
        init() {
            this.fetchDetail();
        },
        async fetchDetail() {
            const id = window.location.pathname.split('/').pop();
            try {
                const r = await api('/websites/' + id);
                if (r.success) {
                    this.site = r.data;
					if (!this.maintenanceTimer && r.data.site_type === 'wordpress') {
						this.loadMaintenance(true);
						this.maintenanceTimer = setInterval(() => this.loadMaintenance(), 10000);
					}
                    this.fcacheEnabled = r.data.fastcgi_cache_enabled;
                    this.fcacheTTL = r.data.fastcgi_cache_ttl || 300;
                    this.disableWPUpdates = r.data.disable_wp_updates || false;
                    this.savedDisableWPUpdates = this.disableWPUpdates;
                    this.disableFileEditing = r.data.disable_file_editing || false;
                    this.savedDisableFileEditing = this.disableFileEditing;
                    this.passwordResetMode = r.data.password_reset_mode || 'allow';
                    this.xmlrpcEnabled = r.data.xmlrpc_enabled || false;
                    this.disableApplicationPasswords = r.data.disable_application_passwords || false;
                    this.wpDebug = r.data.wp_debug_enabled || false;
                    this.wpDebugDisplay = r.data.wp_debug_display || false;
                    this.wpPostRevisions = r.data.wp_post_revisions != null ? r.data.wp_post_revisions : -1;
                    this.wpMemoryLimit = r.data.wp_memory_limit || '';
                    this.logRetentionDays = r.data.log_retention_days ?? 14;
                    this.monitoringEnabled = r.data.monitoring_enabled || false;
                    this.monitoringInterval = r.data.monitoring_interval || 5;
                    this.documentRootSubdir = r.data.document_root_subdir || '';
                    this.cdnRealIPEnabled = r.data.cdn_realip_enabled || false;
                    this.cdnRealIPGroupIDs = (r.data.cdn_realip_groups || []).map(g => g.id);
                    this.sslExportEnabled = r.data.ssl_export_enabled || false;
                    this.fileLockMode = r.data.file_lock_mode === 'strict' ? 'strict' : 'standard';
                    this.fileLockPreview = null;
                }
            } catch(e) { showToast(t('website.load_failed_with_error', { error: e.message }), 'error'); }
            this.loading = false;
            Promise.allSettled([
                this.fetchNginxCustom(),
                this.fetchPluginStatus(),
                this.fetchCDNGroups(),
                this.fetchAIDevelopment()
            ]);
            deferTask(() => {
                this.fetchLogs();
                this.fetchLogFiles();
            }, 400);
        },
        async fetchAIDevelopment() {
            if (!this.site) return;
            this.aiAccess.loading = true;
            try {
                const r = await api('/websites/' + this.site.id + '/ai-development-access');
                if (r.success) {
                    const tools = Array.isArray(r.data.tools) ? r.data.tools : [];
                    const wpCLIInstalled = tools.some(tool => tool.id === 'wp-cli' && tool.installed);
                    this.aiAccess = {
                        ...this.aiAccess,
                        ...r.data,
                        tools,
                        loading: false,
                        busy: false,
                        installWPCLI: r.data.status === 'disabled' ? !wpCLIInstalled : false,
                        installNodeJS: false
                    };
                }
            } catch(e) { this.aiAccess.loading = false; }
        },
        developmentToolInstalled(id) {
            return Array.isArray(this.aiAccess.tools) && this.aiAccess.tools.some(tool => tool.id === id && tool.installed);
        },
        async requestAIDevelopmentPackage(path, body) {
            const prefix = document.body.dataset.panelPrefix || '';
            const response = await fetch(prefix + '/api' + path, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]')?.content || ''
                },
                body: JSON.stringify(body || {})
            });
            if (!response.ok) {
                let message = t('common.operation_failed');
                let code = null;
                try { const data = await response.json(); message = data.message || message; code = data.data?.code || null; } catch(e) {}
                const err = new Error(message);
                err.code = code;
                throw err;
            }
            return await response.blob();
        },
        saveAIDevelopmentPackage(blob) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = this.site.domain + '-wp-panel-ai.zip';
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
        },
        async enableAIDevelopment(force) {
            if (this.aiAccess.confirmDomain !== this.site.domain) return;
            if (!force && !await confirmModal(t('ai_development.enable_confirm', { domain: this.site.domain }))) return;
            this.aiAccess.busy = true;
            let retryForce = false;
            try {
                if (this.aiAccess.installWPCLI && !this.developmentToolInstalled('wp-cli')) {
                    this.aiAccess.stage = t('ai_development.stage_installing_wp_cli');
                    await api('/software/development-tools/install', { method: 'POST', body: { id: 'wp-cli' }, timeout: 600000 });
                }
                if (this.aiAccess.installNodeJS && !this.developmentToolInstalled('nodejs')) {
                    this.aiAccess.stage = t('ai_development.stage_installing_nodejs');
                    await api('/software/development-tools/install', { method: 'POST', body: { id: 'nodejs' }, timeout: 600000 });
                }
                this.aiAccess.stage = t('ai_development.stage_configuring_access');
                this.aiCredentialPackage = await this.requestAIDevelopmentPackage('/websites/' + this.site.id + '/ai-development-access', {
                    confirm_domain: this.aiAccess.confirmDomain,
                    install_wp_cli: false,
                    install_nodejs: false,
                    force: !!force
                });
                this.aiCredentialDownloaded = false;
                showToast(t('ai_development.enabled_ready_download'), 'success');
                await this.fetchAIDevelopment();
            } catch(e) {
                if (!force && e.code === 'ai_development_site_busy') {
                    this.aiAccess.busy = false;
                    this.aiAccess.stage = '';
                    retryForce = await confirmModal(t('ai_development.enable_busy_force_confirm'));
                } else {
                    showToast(e.message, 'error');
                    await this.fetchAIDevelopment();
                }
            } finally {
                this.aiAccess.busy = false;
                this.aiAccess.stage = '';
            }
            if (retryForce) return this.enableAIDevelopment(true);
        },
        async downloadAIDevelopmentCredential() {
            if (this.aiCredentialPackage && !this.aiCredentialDownloaded) {
                this.saveAIDevelopmentPackage(this.aiCredentialPackage);
                this.aiCredentialPackage = null;
                this.aiCredentialDownloaded = true;
                showToast(t('ai_development.package_downloaded'), 'success');
                return;
            }
            if (!await confirmModal(t('ai_development.redownload_rotates_confirm'))) return;
            this.aiAccess.busy = true;
            this.aiAccess.stage = t('ai_development.stage_rotating_package');
            try {
                this.aiCredentialPackage = await this.requestAIDevelopmentPackage('/websites/' + this.site.id + '/ai-development-access/rotate', {});
                this.saveAIDevelopmentPackage(this.aiCredentialPackage);
                this.aiCredentialPackage = null;
                this.aiCredentialDownloaded = true;
                showToast(t('ai_development.rotated_downloaded'), 'success');
                await this.fetchAIDevelopment();
            } catch(e) { showToast(e.message, 'error'); }
            finally {
                this.aiAccess.busy = false;
                this.aiAccess.stage = '';
            }
        },
        async copyAIDevelopmentFirstPrompt() {
            try {
                await navigator.clipboard.writeText(t('ai_development.first_prompt'));
                showToast(t('ai_development.first_prompt_copied'), 'success');
            } catch(e) {
                showToast(t('common.operation_failed'), 'error');
            }
        },
        async disableAIDevelopment() {
            if (!await confirmModal(t('ai_development.disable_confirm'))) return;
            this.aiAccess.busy = true;
            try {
                await api('/websites/' + this.site.id + '/ai-development-access', { method: 'DELETE' });
                showToast(t('ai_development.disabled'), 'success');
                this.aiCredentialPackage = null;
                this.aiCredentialDownloaded = false;
                this.aiAccess = { loading: false, enabled: false, status: 'disabled', busy: false, stage: '', installWPCLI: true, installNodeJS: false, confirmDomain: '', tools: [] };
            } catch(e) { showToast(e.message, 'error'); }
            finally { this.aiAccess.busy = false; }
        },
        async restoreMigrated() {
            if (!this.site || this.site.status !== 'migrated') return;
            if (!await confirmModal(t('website.restore_migrated_confirm', { domain: this.site.domain }))) return;
            try {
                const r = await api('/websites/' + this.site.id + '/status', { method: 'PATCH', body: { action: 'restore_migrated' } });
                if (r.success) {
                    this.site.status = 'active';
                    showToast(r.data?.message || t('website.restore_migrated_success'), 'success');
                }
            } catch(e) { showToast(e.message, 'error'); }
        },
        async fetchCDNGroups() {
            try {
                const r = await api('/security/cdn-realip-groups');
                if (r.success) {
                    this.cdnGroups = r.data || [];
                    this.normalizeCDNRealIPSelection();
                }
            } catch(e) {}
        },
        selectableCDNGroups() {
            return this.cdnGroups.filter(g => g.provider !== 'cloudflare');
        },
        normalizeCDNRealIPSelection() {
            const currentIDs = this.cdnRealIPGroupIDs.map(id => parseInt(id));
            const selected = this.cdnGroups.filter(g => currentIDs.includes(g.id));
            const selectedNonCloudflareIDs = selected.filter(g => g.provider !== 'cloudflare').map(g => g.id);
            if (this.cdnRealIPEnabled && selected.length > 0 && selectedNonCloudflareIDs.length === 0) {
                this.cdnRealIPEnabled = false;
            }
            this.cdnRealIPGroupIDs = selectedNonCloudflareIDs;
        },
        normalizeCDNRealIPCompatibility(changedGroup) {
            if (!this.cdnRealIPGroupIDs.map(Number).includes(changedGroup.id)) return;
            const changedCompatible = !(changedGroup.ip_ranges || '').trim();
            this.cdnRealIPGroupIDs = this.cdnRealIPGroupIDs.filter(id => {
                const group = this.cdnGroups.find(g => g.id === Number(id));
                if (!group) return false;
                return changedCompatible ? group.id === changedGroup.id : (group.ip_ranges || '').trim();
            });
        },
        cdnRealIPModeText() {
            if (!this.cdnRealIPEnabled) return '';
            const currentIDs = this.cdnRealIPGroupIDs.map(id => parseInt(id));
            const selected = this.selectableCDNGroups().filter(g => currentIDs.includes(g.id));
            if (selected.length === 0) return t('website.cdn_select_non_cloudflare_help');
            const headers = [...new Set(selected.map(g => (g.header_name || '').toLowerCase()))];
            if (headers.length > 1) return t('website.cdn_header_mismatch');
            if (selected.some(g => !(g.ip_ranges || '').trim())) {
                return t('website.cdn_compatible_no_origin_ips');
            }
            return t('website.cdn_strict_origin_ips');
        },
        async saveCDNRealIP() {
            this.cdnRealIPSaving = true;
            try {
                const groupIDs = this.cdnRealIPGroupIDs.map(id => parseInt(id)).filter(id => this.selectableCDNGroups().some(g => g.id === id));
                if (this.cdnRealIPEnabled && groupIDs.length === 0) {
                    showToast(t('website.cdn_select_non_cloudflare_required'), 'error');
                    return;
                }
                const r = await api('/websites/' + this.site.id + '/cdn-realip', {
                    method: 'PUT',
                    body: { enabled: this.cdnRealIPEnabled, group_ids: groupIDs }
                });
                showToast(r.data?.message || t('website.cdn_realip_saved'), 'success');
                await this.fetchDetail();
            } catch(e) { showToast(e.message, 'error'); }
            finally { this.cdnRealIPSaving = false; }
        },
        async enableSSL() {
            if (this.sslMode === 'manual' && (!this.sslCert || !this.sslKey)) {
                showToast(t('website.ssl_manual_required'), 'error');
                return;
            }
            this.sslSubmitting = true;
            try {
                const body = { mode: this.sslMode };
                if (this.sslMode === 'manual') {
                    body.certificate = this.sslCert;
                    body.private_key = this.sslKey;
                }
                const r = await api('/websites/' + this.site.id + '/ssl', { method: 'POST', body });
                if (r.success) {
                    showToast(r.data?.message || t('common.operation_success'), 'success');
                    this.sslModalOpen = false;
                    await this.fetchDetail();
                } else {
                    showToast(r.data?.message || t('common.operation_failed'), 'error');
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
            this.sslSubmitting = false;
        },
        downloadSSLPackage() {
            if (!this.site || !this.site.ssl_enabled) return;
            const prefix = '/' + document.body.dataset.panelPrefix.replace('/', '');
            window.open(prefix + '/api/websites/' + this.site.id + '/ssl/download');
        },
        async saveSSLExport() {
            if (!this.site) return;
            this.sslExportSaving = true;
            try {
                const r = await api('/websites/' + this.site.id + '/ssl/export', {
                    method: 'PUT',
                    body: { enabled: this.sslExportEnabled }
                });
                showToast(r.data?.message || t('website.ssl_export_saved'), 'success');
                await this.fetchDetail();
            } catch(e) {
                this.sslExportEnabled = !this.sslExportEnabled;
                showToast(e.message, 'error');
            } finally {
                this.sslExportSaving = false;
            }
        },
        async updateDomains() {
            this.domainSubmitting = true;
            try {
                const newDomain = this.editDomain.trim();
                if (!newDomain) { showToast(t('website.domain_required'), 'error'); this.domainSubmitting = false; return; }
                const aliases = this.editAliasesStr.split('\n').map(a => a.trim()).filter(a => a);
                const domainChanged = newDomain.toLowerCase() !== this.site.domain.toLowerCase();
                const body = { new_domain: newDomain, aliases, sync_wp_site_urls: this.syncWPSiteURLs && domainChanged };
                const r = await api('/websites/' + this.site.id + '/domains', { method: 'PUT', body });
                if (r.success) {
                    showToast(r.data?.message || t('website.updated'), 'success');
                    this.domainModalOpen = false;
                    await this.fetchDetail();
                } else {
                    showToast(r.data?.message || t('common.operation_failed'), 'error');
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
            this.domainSubmitting = false;
        },
        async openDomainModal() {
            this.editDomain = this.site.domain;
            this.editAliasesStr = this.site.aliases || '';
            this.syncWPSiteURLs = false;
            this.wpSiteURL = '';
            this.wpHomeURL = '';
            this.wpURLsError = '';
            this.domainModalOpen = true;
            if (this.site.site_type !== 'wordpress') return;
            this.wpURLsLoading = true;
            try {
                const r = await api('/websites/' + this.site.id + '/wp-site-urls');
                this.wpSiteURL = r.data?.siteurl || '';
                this.wpHomeURL = r.data?.home || '';
                if (!this.canSyncWPSiteURLs()) this.wpURLsError = t('website.wp_site_urls_domain_mismatch');
            } catch (e) {
                this.wpURLsError = t('website.wp_site_urls_read_failed', { error: e.message });
            } finally {
                this.wpURLsLoading = false;
            }
        },
        previewWPURL(value) {
            try {
                const parsed = new URL(value);
                if (parsed.hostname.toLowerCase() !== this.site.domain.toLowerCase()) return '';
                const replacement = this.editDomain.trim().toLowerCase() + (parsed.port ? ':' + parsed.port : '');
                return value.replace(parsed.host, replacement);
            } catch (e) {
                return '';
            }
        },
        canSyncWPSiteURLs() {
            return !!this.previewWPURL(this.wpSiteURL) && !!this.previewWPURL(this.wpHomeURL);
        },
        async removeSSL() {
            if (!await confirmModal(t('website.confirm_delete_ssl', { domain: this.site.domain }))) return;
            try {
                const r = await api('/websites/' + this.site.id + '/ssl', { method: 'DELETE' });
                if (r.success) {
                    showToast(r.data?.message || t('website.ssl_deleted'), 'success');
                    await this.fetchDetail();
                } else {
                    showToast(r.data?.message || t('common.operation_failed'), 'error');
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
        },
        async fetchNginxCustom() {
            try {
                const r = await api('/websites/' + this.site.id + '/nginx-custom');
                if (r.success) {
                    this.nginxPreContent = r.data.pre_content || '';
                    this.nginxContent = r.data.content || '';
                    this.accessLogMode = r.data.access_log_mode || 'off';
                }
            } catch(e) { /* 静默失败 */ }
        },
        async saveDocumentRoot() {
            if (!this.site || this.site.site_type !== 'php') return;
            this.documentRootSaving = true;
            try {
                const r = await api('/websites/' + this.site.id + '/document-root', {
                    method: 'PUT',
                    body: { document_root_subdir: this.documentRootSubdir }
                });
                if (r.success) {
                    showToast(r.data?.message || t('website.document_root_saved'), 'success');
                    await this.fetchDetail();
                } else {
                    showToast(r.data?.message || t('website.save_failed'), 'error');
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
            this.documentRootSaving = false;
        },
        async saveNginxCustom() {
            this.nginxSubmitting = true;
            try {
                const r = await api('/websites/' + this.site.id + '/nginx-custom', {
                    method: 'PUT',
                    body: { pre_content: this.nginxPreContent, content: this.nginxContent }
                });
                if (r.success) {
                    showToast(r.data?.message || t('common.saved'), 'success');
                } else {
                    showToast(r.data?.message || t('website.save_failed'), 'error');
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
            this.nginxSubmitting = false;
        },
        async fetchLogs() {
            if (!this.site) return;
            try {
                let url = '/websites/' + this.site.id + '/logs?type=' + this.logType + '&lines=' + encodeURIComponent(this.logLineLimit || 200);
                const r = await api(url);
                if (r.success) {
                    this.logContent = r.data.content;
                }
            } catch(e) { showToast(t('website.load_logs_failed', { error: e.message }), 'error'); }
        },
        async fetchLogFiles() {
            if (!this.site) return;
            try {
                const r = await api('/websites/' + this.site.id + '/log-files?type=' + this.logType);
                if (r.success) {
                    this.logFiles = r.data.files || [];
                }
            } catch(e) { showToast(t('website.load_log_files_failed', { error: e.message }), 'error'); }
        },
        selectLogType(type) {
            this.logType = type;
            this.fetchLogs();
            this.fetchLogFiles();
        },
        currentLogFilename() {
            if (this.logType === 'error') return 'error.log';
            if (this.logType === 'security') return 'wp-security.log';
            return 'access.log';
        },
        downloadLogFile(filename) {
            if (!this.site || !filename) return;
            const prefix = document.body.dataset.panelPrefix || '';
            window.open(prefix + '/api/websites/' + this.site.id + '/logs/download?type=' + encodeURIComponent(this.logType) + '&file=' + encodeURIComponent(filename));
        },
        async setAccessLogMode(mode) {
            try {
                const r = await api('/websites/' + this.site.id + '/access-log', { method: 'PUT', body: { mode } });
                if (r.success) {
                    this.accessLogMode = mode;
                    if (mode === 'off') {
                        this.logContent = '';
                    }
                    showToast(r.data?.message, 'success');
                } else {
                    showToast(r.data?.message || t('common.operation_failed'), 'error');
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
        },
        async clearLogs() {
            const label = this.logType === 'error' ? t('website.log_type_error') : (this.logType === 'security' ? t('website.log_type_security') : t('website.log_type_access'));
            if (!await confirmModal(t('website.confirm_clear_logs', { label }))) return;
            try {
                const r = await api('/websites/' + this.site.id + '/logs?type=' + this.logType, { method: 'DELETE' });
                if (r.success) {
                    showToast(t('website.logs_cleared'), 'success');
                    this.logContent = t('website.log_empty_or_missing');
                    this.fetchLogFiles();
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
        },
        async fetchPluginStatus() {
            if (!this.site || this.site.site_type !== 'wordpress' || this.pluginStatusLoading) return;
            this.pluginStatusLoading = true;
            this.pluginStatus = 'unknown';
            try {
                const r = await api('/websites/' + this.site.id + '/install-plugin/status');
                const statuses = ['not_installed', 'inactive', 'installed', 'update_available', 'config_missing', 'unknown'];
                if (r.success && statuses.includes(r.data?.status)) this.pluginStatus = r.data.status;
            } catch(e) {
                this.pluginStatus = 'unknown';
            } finally {
                this.pluginStatusLoading = false;
            }
        },
        async installPlugin() {
            this.pluginInstalling = true;
            try {
                const r = await api('/websites/' + this.site.id + '/install-plugin', { method: 'POST' });
                showToast(r.data?.message || t('website.installed'), 'success');
                await this.fetchPluginStatus();
            } catch(e) { showToast(e.message, 'error'); }
            this.pluginInstalling = false;
        },
        async rebuildPluginConfig() {
            if (!await confirmModal(t('website.rebuild_plugin_config_confirm'))) return;
            await this.installPlugin();
        },
        fileLockStatusText() {
            if (this.site.file_lock_apply_status === 'applying') return t('website.processing');
            if (this.fileLockApplyIncomplete()) return t('website.file_lock_apply_failed');
            if (!this.site.file_lock_enabled) return t('website.file_unlocked');
            if (this.site.file_lock_mode === 'legacy') return t('website.file_lock_legacy');
            return this.site.file_lock_mode === 'strict' ? t('website.file_lock_strict') : t('website.file_lock_standard');
        },
        fileLockApplyIncomplete() {
            return this.site.file_lock_apply_status === 'failed';
        },
        fileLockDisplayPath(path) {
            const labels = {
                'wp-content/uploads': t('website.file_lock_path_uploads'),
                'wp-content/cache': t('website.file_lock_path_cache'),
                'wp-content/wflogs': t('website.file_lock_path_wflogs'),
                'wp-content/languages': t('website.file_lock_path_languages'),
                'wp-content/plugins': t('website.file_lock_path_plugins'),
                'wp-content/themes': t('website.file_lock_path_themes'),
                'wp-content/mu-plugins': t('website.file_lock_path_mu_plugins'),
                'wp-config.php': t('website.file_lock_path_wp_config'),
                '.user.ini': t('website.file_lock_path_user_ini'),
                'php.ini': t('website.file_lock_path_php_ini'),
                'wordfence-waf.php': t('website.file_lock_path_wordfence_waf'),
                'wp-content/advanced-cache.php': t('website.file_lock_path_advanced_cache'),
                'wp-content/object-cache.php': t('website.file_lock_path_object_cache'),
                'wp-content/db.php': t('website.file_lock_path_db_dropin'),
                'wp-content/sunrise.php': t('website.file_lock_path_sunrise')
            };
            return labels[path] || path;
        },
        async loadFileLockPreview() {
            if (!this.site?.id) return null;
            this.fileLockPreviewLoading = true;
            try {
                const r = await api('/websites/' + this.site.id + '/file-lock/preview?mode=' + encodeURIComponent(this.fileLockMode));
                this.fileLockPreview = r.data || null;
                return this.fileLockPreview;
            } catch(e) {
                showToast(e.message, 'error');
                return null;
            } finally {
                this.fileLockPreviewLoading = false;
            }
        },
        async applyFileLock(enabled) {
            let prompt = t('website.file_lock_disable_confirm');
            if (enabled) {
                const preview = await this.loadFileLockPreview();
                if (!preview) return;
                prompt = t('website.file_lock_apply_confirm', {
                    mode: this.fileLockMode === 'strict' ? t('website.file_lock_mode_strict') : t('website.file_lock_mode_standard'),
                    readonly: (preview.read_only_dirs || []).length,
                    executable: (preview.executable_files || []).length,
                    symlink: (preview.symlink_paths || []).length
                });
            }
            if (!await confirmModal(prompt)) return;
            this.fileLockSaving = true;
            try {
                const r = await api('/websites/' + this.site.id + '/file-lock', {
                    method: 'PUT',
                    body: { enabled, mode: enabled ? this.fileLockMode : '' }
                });
                this.site.file_lock_enabled = r.data?.file_lock_enabled ?? enabled;
                this.site.file_lock_mode = r.data?.file_lock_mode || '';
                this.site.file_lock_apply_status = r.data?.file_lock_apply_status || '';
                showToast(r.data?.message || (enabled ? t('website.file_lock_enabled') : t('website.file_lock_disabled')), 'success');
            } catch(e) {
                const selectedMode = this.fileLockMode;
                showToast(e.message, 'error');
                await this.fetchDetail();
                this.fileLockMode = selectedMode;
            }
            this.fileLockSaving = false;
        },
        async saveMonitoring() {
            this.monitoringSaving = true;
            try {
                await api('/websites/' + this.site.id + '/monitoring', {
                    method: 'PUT',
                    body: { enabled: this.monitoringEnabled, interval: parseInt(this.monitoringInterval) || 5 }
                });
                showToast(t('website.monitoring_saved'), 'success');
            } catch(e) { showToast(t('website.save_failed_with_error', { error: e.message }), 'error'); }
            this.monitoringSaving = false;
        },
        async saveExpiry() {
            this.expirySaving = true;
            try {
                await api('/websites/' + this.site.id + '/expiry', {
                    method: 'PUT',
                    body: { expires_at: this.expiresAtInput }
                });
                this.site.expires_at = this.expiresAtInput || null;
                this.editingExpiry = false;
                showToast(t('website.expiry_saved'), 'success');
            } catch(e) { showToast(t('website.save_failed_with_error', { error: e.message }), 'error'); }
            this.expirySaving = false;
        },
        async saveWPOptimizations() {
            this.optimizationSaving = true;
            try {
                await api('/websites/' + this.site.id + '/wp-optimizations', {
                    method: 'PUT',
                    body: {
                        fcache_enabled: this.fcacheEnabled,
                        fcache_ttl: parseInt(this.fcacheTTL) || 300,
                        disable_wp_updates: this.disableWPUpdates,
                        expected_disable_wp_updates: this.savedDisableWPUpdates,
                        disable_file_editing: this.disableFileEditing,
                        xmlrpc_enabled: this.xmlrpcEnabled,
                        disable_application_passwords: this.disableApplicationPasswords,
                        wp_debug_enabled: this.wpDebug,
                        wp_debug_display: this.wpDebug && this.wpDebugDisplay,
                        wp_post_revisions: this.wpPostRevisions,
                        wp_memory_limit: this.wpMemoryLimit
                    }
                });
                this.savedDisableWPUpdates = this.disableWPUpdates;
                showToast(t('website.optimization_saved'), 'success');
            } catch(e) { showToast(t('website.save_failed_with_error', { error: e.message }), 'error'); }
            this.optimizationSaving = false;
        },
        async saveFileEditingProtection() {
            if (this.site.file_lock_enabled) return;
            this.fileEditingSaving = true;
            try {
                const r = await api('/websites/' + this.site.id + '/file-editor', {
                    method: 'PUT',
                    body: { enabled: this.disableFileEditing }
                });
                this.disableFileEditing = r.data?.disable_file_editing ?? this.disableFileEditing;
                this.savedDisableFileEditing = this.disableFileEditing;
                showToast(r.data?.message || t('website.file_editing_saved'), 'success');
            } catch(e) {
                this.disableFileEditing = this.savedDisableFileEditing;
                showToast(e.message, 'error');
            }
            this.fileEditingSaving = false;
        },
        async savePasswordReset() {
            this.passwordResetSaving = true;
            try {
                const r = await api('/websites/' + this.site.id + '/password-reset', {
                    method: 'PUT',
                    body: { mode: this.passwordResetMode }
                });
                this.passwordResetMode = r.data?.password_reset_mode ?? this.passwordResetMode;
                showToast(r.data?.message || t('website.password_reset_saved'), 'success');
            } catch(e) { showToast(e.message, 'error'); }
            this.passwordResetSaving = false;
        },
        async saveLogRetention() {
            try {
                await api('/websites/' + this.site.id + '/log-retention', {
                    method: 'PUT',
                    body: { retention_days: parseInt(this.logRetentionDays) || 0 }
                });
            } catch(e) {}
        },
        async clearFCache() {
            if (!await confirmModal(t('website.confirm_clear_cache'))) return;
            try {
                await api('/websites/' + this.site.id + '/cache', { method: 'DELETE' });
                showToast(t('website.cache_cleared'), 'success');
            } catch(e) { showToast(e.message, 'error'); }
        },
    }
}
</script>
