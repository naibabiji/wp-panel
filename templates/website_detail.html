{{template "base" .}}
{{define "websites_detail_content"}}
<div x-data="websiteDetail()" x-init="init()">

    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-white">{{t .Lang "website.detail_title"}}</h2>
        <a href="/{{.RandomSuffix}}/websites" class="btn-secondary">{{t .Lang "website.back_to_list"}}</a>
    </div>

    <div x-show="loading" class="text-center py-8">
        <div class="text-sm text-gray-400">{{t .Lang "website.loading"}}</div>
    </div>
<template x-if="site">
    <div>

    <!-- Row 1: 基本信息 | 网站运行与配置 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="card">
            <h3 class="text-lg font-semibold text-white mb-4">{{t .Lang "website.basic_info"}}</h3>
            <dl class="space-y-3">
                <div><dt class="text-sm text-gray-400">{{t .Lang "website.domain"}}</dt><dd><a :href="(site.ssl_enabled ? 'https' : 'http') + '://' + site.domain" target="_blank" class="text-blue-400 hover:text-blue-300 hover:underline" x-text="site.domain"></a></dd></div>
                <div><dt class="text-sm text-gray-400">{{t .Lang "website.aliases"}}</dt><dd class="text-white" x-text="site.aliases || t('common.none')"></dd></div>
                <div class="pt-2">
                    <button @click="domainModalOpen = true; editDomain = site.domain; editAliasesStr = site.aliases || ''" class="text-sm py-1.5 px-3 rounded" style="background-color: #1e3a5f; color: #93c5fd;">{{t .Lang "website.edit_domain"}}</button>
                    <a :href="(document.body.dataset.panelPrefix || '') + '/files?site_id=' + site.id" class="text-sm py-1.5 px-3 rounded ml-2 inline-block" style="background-color: #1e3a5f; color: #93c5fd;">{{t .Lang "nav.files"}}</a>
                    <a :href="(document.body.dataset.panelPrefix || '') + '/databases/' + site.id" class="text-sm py-1.5 px-3 rounded ml-2 inline-block" style="background-color: #1e3a5f; color: #93c5fd;">{{t .Lang "nav.databases"}}</a>
                    <a :href="(document.body.dataset.panelPrefix || '') + '/ai-diagnostics?site_id=' + site.id" class="text-sm py-1.5 px-3 rounded ml-2 inline-block" style="background-color: #14532d; color: #86efac;">{{t .Lang "nav.ai_diagnostics"}}</a>
                </div>
                <div><dt class="text-sm text-gray-400">{{t .Lang "website.status"}}</dt><dd><span :class="site.status === 'active' ? 'badge-success' : 'badge-warning'" x-text="site.status === 'active' ? t('website.status_running') : t('website.status_paused')"></span></dd></div>
                <div><dt class="text-sm text-gray-400">{{t .Lang "website.type"}}</dt><dd class="text-white" x-text="site.site_type === 'php' ? t('website.generic_php_site') : 'WordPress'"></dd></div>
                <div class="pt-2 border-t border-gray-700/50">
                    <dt class="text-sm text-gray-400 mb-2">{{t .Lang "website.cdn_real_ip"}}</dt>
                    <div class="rounded border border-blue-900/60 bg-blue-950/30 p-2 mb-2 text-xs text-blue-200">
                        <p>{{t .Lang "website.cloudflare_realip_auto"}}</p>
                        <p class="mt-1 text-blue-200/80">{{t .Lang "website.non_cloudflare_cdn_notice"}}</p>
                    </div>
                    <label class="flex items-center space-x-2 text-sm text-gray-300 mb-2">
                        <input type="checkbox" x-model="cdnRealIPEnabled">
                        <span>{{t .Lang "website.enable_other_cdn_realip"}}</span>
                    </label>
                    <div x-show="cdnRealIPEnabled" class="space-y-2">
                        <template x-for="g in selectableCDNGroups()" :key="g.id">
                            <label class="flex items-start space-x-2 text-sm text-gray-300">
                                <input type="checkbox" class="mt-1" :value="g.id" x-model="cdnRealIPGroupIDs" @change="normalizeCDNRealIPCompatibility(g)" :disabled="!g.enabled">
                                <span>
                                    <span class="text-white" x-text="g.name"></span>
                                    <span class="text-xs text-gray-500" x-text="' · ' + g.header_name"></span>
                                </span>
                            </label>
                        </template>
                        <p x-show="selectableCDNGroups().length === 0" class="text-xs text-gray-500">{{t .Lang "website.no_non_cloudflare_cdn_groups"}}</p>
                        <p class="text-xs text-gray-500" x-text="cdnRealIPModeText()"></p>
                    </div>
                    <button @click="saveCDNRealIP()" :disabled="cdnRealIPSaving" class="btn-primary text-sm mt-2" x-text="cdnRealIPSaving ? t('common.saving') : t('website.save_other_cdn_settings')"></button>
                </div>
                <div><dt class="text-sm text-gray-400">{{t .Lang "website.system_user"}}</dt><dd class="text-white font-mono" x-text="site.system_user"></dd></div>
                <div><dt class="text-sm text-gray-400">{{t .Lang "website.site_root"}}</dt><dd class="text-white font-mono text-sm" x-text="site.web_root"></dd></div>
                <div x-show="site.site_type === 'php'">
                    <dt class="text-sm text-gray-400">{{t .Lang "website.document_root"}}</dt>
                    <dd class="flex items-center space-x-2 mt-1">
                        <select x-model="documentRootSubdir" class="input-field text-sm py-1 w-56">
                            <option value="">{{t .Lang "website.project_root"}}</option>
                            <option value="public">{{t .Lang "website.public_root_option"}}</option>
                        </select>
                        <button @click="saveDocumentRoot()" :disabled="documentRootSaving" class="btn-primary text-xs py-1 px-2" x-text="documentRootSaving ? t('common.saving') : t('common.save')"></button>
                    </dd>
                    <p class="text-xs text-gray-500 mt-1">{{t .Lang "website.document_root_detail_help"}}</p>
                </div>
                <div><dt class="text-sm text-gray-400">{{t .Lang "website.log_dir"}}</dt><dd class="text-white font-mono text-sm" x-text="site.log_dir"></dd></div>
                <div>
                    <dt class="text-sm text-gray-400">{{t .Lang "website.expiry_time"}}</dt>
                    <dd class="text-white" x-show="!editingExpiry" x-text="site.expires_at ? new Date(site.expires_at).toLocaleDateString('zh-CN') : t('common.none')"></dd>
                    <div x-show="editingExpiry" class="flex items-center space-x-2">
                        <input type="date" x-model="expiresAtInput" class="input-field text-sm py-1 w-44">
                        <button @click="saveExpiry()" :disabled="expirySaving" class="btn-primary text-xs py-1 px-2" x-text="expirySaving ? t('common.saving') : t('common.save')"></button>
                        <button @click="editingExpiry = false" class="text-gray-400 hover:text-white text-xs">{{t .Lang "website.cancel"}}</button>
                    </div>
                </div>
                <div class="pt-1" x-show="!editingExpiry">
                    <button @click="editingExpiry = true; expiresAtInput = site.expires_at ? site.expires_at.substring(0, 10) : ''" class="text-xs py-1 px-2 rounded" style="background-color: #1e3a5f; color: #93c5fd;">{{t .Lang "website.edit_expiry_time"}}</button>
                </div>
            </dl>
        </div>

        <div class="card">
            <h3 class="text-lg font-semibold text-white mb-5">{{t .Lang "website.runtime_configuration"}}</h3>
            <h4 class="text-base font-medium text-white mb-3">{{t .Lang "website.site_monitoring"}}</h4>
            <label class="flex items-center space-x-2 text-sm text-gray-300 cursor-pointer mb-3">
                <input type="checkbox" x-model="monitoringEnabled">
                <span>{{t .Lang "website.enable_site_monitoring"}}</span>
            </label>
            <div x-show="monitoringEnabled" class="flex items-center space-x-2 mb-4">
                <span class="text-xs text-gray-500">{{t .Lang "website.check_interval"}}</span>
                <select x-model="monitoringInterval" class="input-field w-24 text-sm py-1">
                    <option value="1">{{t .Lang "website.minute_1"}}</option>
                    <option value="5">{{t .Lang "website.minute_5"}}</option>
                    <option value="10">{{t .Lang "website.minute_10"}}</option>
                    <option value="30">{{t .Lang "website.minute_30"}}</option>
                </select>
            </div>
            <button @click="saveMonitoring()" :disabled="monitoringSaving" class="btn-primary text-sm" x-text="monitoringSaving ? t('common.saving') : t('website.save_settings')"></button>
            <p x-show="monitoringEnabled" class="text-xs text-gray-500 mt-3">{{t .Lang "website.monitoring_enabled_help"}}</p>
            <p x-show="!monitoringEnabled" class="text-xs text-gray-600 mt-3">{{t .Lang "website.monitoring_disabled_help"}}</p>

            <hr class="my-5 border-gray-700">

            <h4 class="text-base font-medium text-white mb-3">{{t .Lang "website.ssl_management"}}</h4>
            <div class="mb-3">
                <span :class="site.ssl_enabled ? 'badge-success' : site.ssl_last_error ? 'badge-warning' : 'badge-info'" class="text-sm" x-text="site.ssl_enabled ? t('website.ssl_enabled') : site.ssl_last_error ? t('website.ssl_pending') : t('website.ssl_not_enabled')"></span>
            </div>
            <div x-show="!site.ssl_enabled && site.ssl_last_error" class="mb-4 p-3 bg-yellow-900/40 border border-yellow-700 rounded-lg text-yellow-200 text-sm">
                <p class="font-medium mb-1">{{t .Lang "website.last_ssl_failed"}}</p>
                <p x-text="site.ssl_last_error"></p>
            </div>
            <div x-show="site.ssl_enabled">
                <dl class="space-y-3 mb-4">
                    <div><dt class="text-sm text-gray-400">{{t .Lang "website.cert_path"}}</dt><dd class="text-white font-mono text-sm break-all" x-text="site.ssl_cert_path"></dd></div>
                    <div><dt class="text-sm text-gray-400">{{t .Lang "website.private_key_path"}}</dt><dd class="text-white font-mono text-sm break-all" x-text="site.ssl_key_path"></dd></div>
                    <div><dt class="text-sm text-gray-400">{{t .Lang "website.expiry_time"}}</dt><dd class="text-white" x-text="site.ssl_expires_at ? new Date(site.ssl_expires_at).toLocaleDateString(currentLocale()) : t('website.unknown')"></dd></div>
                </dl>
                <div class="flex flex-wrap gap-3">
                    <button @click="downloadSSLPackage()" class="text-sm py-1.5 px-3 rounded" style="background-color: #374151; color: #e5e7eb;">{{t .Lang "website.download_cert_package"}}</button>
                    <button @click="sslMode='auto'; sslModalOpen=true" class="text-sm py-1.5 px-3 rounded" style="background-color: #166534; color: #bbf7d0;">{{t .Lang "website.reissue"}}</button>
                    <button @click="sslMode='manual'; sslCert=''; sslKey=''; sslModalOpen=true" class="text-sm py-1.5 px-3 rounded" style="background-color: #1e3a5f; color: #93c5fd;">{{t .Lang "website.replace_cert"}}</button>
                    <button @click="removeSSL()" class="text-sm py-1.5 px-3 rounded" style="background-color: #7f1d1d; color: #fca5a5;">{{t .Lang "website.delete_cert"}}</button>
                </div>
                <label class="mt-4 flex items-start space-x-2 cursor-pointer text-sm text-gray-300">
                    <input type="checkbox" x-model="sslExportEnabled" @change="saveSSLExport()" :disabled="sslExportSaving" class="mt-0.5 w-4 h-4 rounded border-gray-600 bg-gray-700 text-blue-600 focus:ring-blue-500">
                    <span>{{t .Lang "website.allow_plugin_read_ssl"}}</span>
                </label>
            </div>
            <div x-show="!site.ssl_enabled">
                <p class="text-gray-400 mb-4">{{t .Lang "website.ssl_not_enabled"}}</p>
                <button @click="sslMode='auto'; sslModalOpen=true" class="btn-primary">{{t .Lang "website.enable_ssl"}}</button>
            </div>

            <hr class="my-5 border-gray-700">

            <h4 class="text-base font-medium text-white mb-2">{{t .Lang "website.nginx_custom_config"}}</h4>
            <details class="mb-4">
                <summary class="cursor-pointer text-blue-400 hover:text-blue-300 text-xs">{{t .Lang "website.config_examples"}}</summary>
                <div class="mt-2 ml-2 space-y-2 text-gray-500 text-xs">
                    <p>{{t .Lang "website.nginx_pre_config_help"}}</p>
                    <pre class="bg-gray-900 p-2 rounded leading-relaxed">client_max_body_size 128m;
set $custom_var "value";</pre>
                    <p>{{t .Lang "website.nginx_location_config_help"}}</p>
                    <pre class="bg-gray-900 p-2 rounded leading-relaxed">if ($request_uri ~* "/ai-assistant") {
    set $wp_skip_cache 1;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3000;
}</pre>
                    <p class="text-yellow-500">{{t .Lang "website.nginx_config_scope_warning"}}</p>
                </div>
            </details>
            <div class="mb-3">
                <label class="block text-sm text-gray-300 mb-1">{{t .Lang "website.server_level_config"}}</label>
                <textarea x-model="nginxPreContent" rows="3" class="w-full rounded p-2 text-xs font-mono" style="background-color: #0f172a; border: 1px solid #334155; color: #e2e8f0; resize: vertical;" placeholder="client_max_body_size 128m;"></textarea>
            </div>
            <div class="mb-4">
                <label class="block text-sm text-gray-300 mb-1">{{t .Lang "website.location_level_config"}}</label>
                <textarea x-model="nginxContent" rows="6" class="w-full rounded p-2 text-xs font-mono" style="background-color: #0f172a; border: 1px solid #334155; color: #e2e8f0; resize: vertical;" placeholder="if ($request_uri ~* &quot;/ai-assistant&quot;) { set $wp_skip_cache 1; }"></textarea>
            </div>
            <div class="flex space-x-3">
                <button @click="saveNginxCustom()" :disabled="nginxSubmitting" class="btn-primary text-sm" x-text="nginxSubmitting ? t('common.saving') : t('website.save_apply')"></button>
                <button @click="fetchNginxCustom()" class="text-sm py-1.5 px-3 rounded" style="background-color: #1e293b; border: 1px solid #334155; color: #e2e8f0;">{{t .Lang "website.refresh"}}</button>
            </div>
        </div>
    </div>

    <!-- Row 2: WordPress优化 | WordPress文件保护 -->
    <!-- 这张卡片对 wordpress 和 php 两种 site_type 都会渲染（见上面的 :class 三元判断），
         里面混了通用控件（FastCGI 缓存）和多个 WordPress 专属控件。新增/修改任何一个
         "仅 WordPress 站点显示"的元素时，必须把本卡片内所有同类元素都加上
         x-show="site.site_type === 'wordpress'"，不能只改自己新加的那一个——
         之前"高级设置"折叠面板就漏加过，导致通用 PHP 站点也看到了停止更新检查等选项。 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-6">
        <div class="card" :class="site.site_type === 'wordpress' ? '' : 'md:col-span-2'">
            <h3 class="text-lg font-semibold text-white mb-4" x-text="site.site_type === 'wordpress' ? t('website.wp_optimization') : t('website.fastcgi_cache_title')"></h3>
            <div class="flex items-center space-x-3 mb-3">
                <label class="flex items-center space-x-2 text-sm text-gray-300 cursor-pointer">
                    <input type="checkbox" x-model="fcacheEnabled">
                    <span>{{t .Lang "website.enable_fastcgi_cache"}}</span>
                </label>
            </div>
            <div x-show="fcacheEnabled" class="mb-3 ml-6">
                <label class="text-sm text-gray-300 mb-1 block">{{t .Lang "website.cache_ttl_seconds"}}</label>
                <input type="number" x-model="fcacheTTL" class="input-field w-32 text-sm py-1" min="10" max="86400">
            </div>
            <details class="mb-4 rounded border border-gray-700 bg-gray-900/30 px-3 py-2" x-show="site.site_type === 'wordpress'">
                <summary class="cursor-pointer text-sm text-gray-300">{{t .Lang "website.wp_optimization_advanced"}}</summary>
                <label class="mt-3 flex items-start space-x-2 text-sm text-gray-300 cursor-pointer">
                    <input type="checkbox" x-model="disableWPUpdates" class="mt-0.5">
                    <span>
                        <span class="block">{{t .Lang "website.disable_wp_updates"}}</span>
                        <span class="block text-xs text-yellow-300 mt-1">{{t .Lang "website.disable_wp_updates_help"}}</span>
                    </span>
                </label>
            </details>
            <div class="flex items-center space-x-3 mb-3" x-show="site.site_type === 'wordpress'">
                <label class="flex items-center space-x-2 text-sm text-gray-300 cursor-pointer">
                    <input type="checkbox" x-model="wpDebug">
                    <span>{{t .Lang "website.enable_debug_mode"}}</span>
                </label>
            </div>
            <div x-show="wpDebug" class="mb-3 ml-6">
                <p class="text-xs text-gray-400">{{t .Lang "website.debug_mode_help"}}</p>
            </div>
            <div class="flex items-center space-x-3 mb-3" x-show="site.site_type === 'wordpress'">
                <label class="text-sm text-gray-300">
                    <span>{{t .Lang "website.post_revisions"}}</span>
                    <input type="number" :value="wpPostRevisions >= 0 ? wpPostRevisions : ''" @input="wpPostRevisions = $event.target.value === '' ? -1 : parseInt($event.target.value)" class="input-field w-24 text-sm py-1 ml-2" placeholder="{{t .Lang "website.default_placeholder"}}">
                </label>
                <span class="text-xs text-gray-500">{{t .Lang "website.post_revisions_help"}}</span>
            </div>
            <div class="flex items-center space-x-3 mb-3" x-show="site.site_type === 'wordpress'">
                <label class="text-sm text-gray-300">
                    <span>{{t .Lang "website.memory_limit"}}</span>
                    <input type="text" x-model="wpMemoryLimit" class="input-field w-24 text-sm py-1 ml-2" placeholder="{{t .Lang "website.default_placeholder"}} 40M">
                </label>
                <span class="text-xs text-gray-500">{{t .Lang "website.memory_limit_help"}}</span>
            </div>
            <div class="flex items-center space-x-3 mb-4" x-show="site.site_type === 'wordpress'">
                <label class="flex items-center space-x-2 text-sm text-gray-300 cursor-pointer">
                    <input type="checkbox" x-model="xmlrpcEnabled">
                    <span>{{t .Lang "website.allow_xmlrpc"}}</span>
                </label>
                <span class="text-xs text-gray-500">{{t .Lang "website.xmlrpc_help"}}</span>
            </div>
            <div class="flex items-center space-x-3 mb-3">
                <button @click="saveWPOptimizations()" :disabled="optimizationSaving || site.file_lock_enabled" class="btn-primary text-sm" x-text="optimizationSaving ? t('common.saving') : t('website.save_settings')"></button>
                <button x-show="fcacheEnabled" @click="clearFCache()" class="text-sm py-1.5 px-3 rounded" style="background-color: #7f1d1d; color: #fca5a5;">{{t .Lang "website.clear_cache"}}</button>
            </div>
            <div x-show="(fcacheEnabled || disableWPUpdates || wpDebug) && site.site_type === 'wordpress'" class="flex items-center space-x-3 mb-3">
                <button x-show="pluginStatus === 'not_installed'" @click="installPlugin()" :disabled="pluginInstalling || site.file_lock_enabled" class="btn-primary text-sm py-1.5" x-text="pluginInstalling ? t('website.installing') : t('website.install_companion_plugin')"></button>
                <button x-show="pluginStatus === 'update_available'" @click="installPlugin()" :disabled="pluginInstalling || site.file_lock_enabled" class="text-sm py-1.5 px-3 rounded" style="background-color: #166534; color: #bbf7d0;" x-text="pluginInstalling ? t('website.updating') : t('website.update_companion_plugin')"></button>
                <span x-show="pluginStatus === 'installed'" class="text-xs text-green-400">{{t .Lang "website.plugin_installed"}}</span>
            </div>
            <p x-show="site.file_lock_enabled" class="text-xs text-yellow-300 mb-3">{{t .Lang "website.file_lock_enabled_notice"}}</p>

            <div class="mt-3 p-3 rounded text-xs" style="background-color: #0f172a;">
                <p class="text-gray-300 font-medium mb-2">{{t .Lang "website.fastcgi_cache_how_it_works"}}</p>
                <ul class="text-gray-400 space-y-1 list-disc list-inside">
                    <li>{{t .Lang "website.fastcgi_cache_point_static"}}</li>
                    <li>{{t .Lang "website.fastcgi_cache_point_key"}}</li>
                    <li x-show="site.site_type === 'wordpress'">{{t .Lang "website.fastcgi_cache_point_wp_skip"}}</li>
                    <li x-show="site.site_type === 'php'">{{t .Lang "website.fastcgi_cache_point_php_skip"}}</li>
                </ul>
                <p class="text-gray-500 mt-2" x-show="site.site_type === 'wordpress'">{{t .Lang "website.wp_optimizer_plugin_help"}}</p>
            </div>
        </div>

        <div x-show="site.site_type === 'wordpress'" class="card">
            <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <h3 class="text-lg font-semibold text-white">{{t .Lang "website.file_lock"}}</h3>
                        <span class="text-xs px-2 py-0.5 rounded" :class="fileLockApplyIncomplete() ? 'bg-red-900/50 text-red-200 border border-red-700' : (site.file_lock_enabled ? 'bg-yellow-900/50 text-yellow-200 border border-yellow-700' : 'bg-green-900/40 text-green-200 border border-green-800')" x-text="fileLockStatusText()"></span>
                    </div>
                    <p class="text-sm text-gray-400">{{t .Lang "website.file_lock_help"}}</p>
                    <details class="mt-2 text-xs">
                        <summary class="cursor-pointer text-yellow-300">{{t .Lang "website.file_lock_limits_toggle"}}</summary>
                        <div class="mt-2 rounded border border-yellow-900/70 bg-yellow-950/30 px-3 py-2 text-yellow-100">
                            <span class="font-medium">{{t .Lang "website.file_lock_limit_title"}}</span>
                            <span class="text-yellow-200/80">{{t .Lang "website.file_lock_limit_help"}}</span>
                        </div>
                    </details>
                    <p x-show="site.file_lock_mode === 'legacy'" class="text-xs text-yellow-300 mt-2">{{t .Lang "website.file_lock_legacy_notice"}}</p>
                    <p x-show="fileLockApplyIncomplete()" class="text-xs text-red-300 mt-2">{{t .Lang "website.file_lock_apply_failed_notice"}}</p>
                </div>
            </div>

            <div class="mt-4 grid grid-cols-1 sm:grid-cols-[minmax(0,1fr)_auto] gap-3 items-end">
                <label class="block">
                    <span class="text-xs text-gray-400 block mb-1">{{t .Lang "website.file_lock_mode"}}</span>
                    <select x-model="fileLockMode" @change="fileLockPreview = null" :disabled="fileLockSaving" class="input-field w-full text-sm py-1.5">
                        <option value="standard">{{t .Lang "website.file_lock_mode_standard"}}</option>
                        <option value="strict">{{t .Lang "website.file_lock_mode_strict"}}</option>
                    </select>
                </label>
                <div class="flex flex-wrap gap-2">
                    <button @click="loadFileLockPreview()" :disabled="fileLockSaving || fileLockPreviewLoading" class="text-sm py-1.5 px-3 rounded bg-gray-700 text-gray-200" x-text="fileLockPreviewLoading ? t('website.file_lock_checking') : t('website.file_lock_check_impact')"></button>
                    <button x-show="!site.file_lock_enabled || site.file_lock_mode === 'legacy' || site.file_lock_mode !== fileLockMode || fileLockApplyIncomplete()" @click="applyFileLock(true)" :disabled="fileLockSaving" class="text-sm py-1.5 px-3 rounded bg-red-900 text-red-200" x-text="fileLockSaving ? t('website.processing') : (site.file_lock_enabled ? t('website.file_lock_apply_mode') : t('website.enable_lock'))"></button>
                    <button x-show="site.file_lock_enabled" @click="applyFileLock(false)" :disabled="fileLockSaving" class="text-sm py-1.5 px-3 rounded bg-blue-950 text-blue-300" x-text="t('website.unlock')"></button>
                </div>
            </div>
            <p class="text-xs text-gray-500 mt-2" x-text="fileLockMode === 'strict' ? t('website.file_lock_strict_help') : t('website.file_lock_standard_help')"></p>

            <div x-show="fileLockPreview" class="mt-3 rounded border border-gray-700 bg-gray-900/60 p-3 text-xs space-y-2">
                <p class="text-sm font-medium text-white">{{t .Lang "website.file_lock_preview_title"}}</p>

                    <span class="text-gray-400" x-text="t('website.file_lock_writable_dirs')"></span>

                </div>

                    <div x-show="(fileLockPreview?.read_only_dirs || []).length" class="mt-1 flex flex-wrap gap-1.5"><template x-for="path in (fileLockPreview?.read_only_dirs || [])" :key="path"><span class="px-2 py-1 rounded bg-blue-950/60 text-blue-200 border border-blue-900" x-text="fileLockDisplayPath(path)"></span></template></div>
                    <span x-show="!(fileLockPreview?.read_only_dirs || []).length" class="text-gray-300" x-text="t('common.none')"></span>
                </div>
                <div>
                    <span class="text-gray-400" x-text="t('website.file_lock_sensitive_files')"></span>
                    <div x-show="(fileLockPreview?.sensitive_files || []).length" class="mt-1 flex flex-wrap gap-1.5"><template x-for="path in (fileLockPreview?.sensitive_files || [])" :key="path"><span class="px-2 py-1 rounded bg-blue-950/60 text-blue-200 border border-blue-900" x-text="fileLockDisplayPath(path)"></span></template></div>
                    <span x-show="!(fileLockPreview?.sensitive_files || []).length" class="text-gray-300" x-text="t('common.none')"></span>
                </div>
                <div x-show="(fileLockPreview?.executable_files || []).length > 0" class="text-yellow-300">
                    <span x-text="t('website.file_lock_executable_warning', { count: fileLockPreview?.executable_files?.length || 0 })"></span>
                    <ul class="mt-1 ml-4 list-disc text-gray-300"><template x-for="path in (fileLockPreview?.executable_files || []).slice(0, 20)" :key="path"><li x-text="path"></li></template></ul>
                </div>
                <div x-show="(fileLockPreview?.symlink_paths || []).length > 0" class="text-yellow-300">
                    <span x-text="t('website.file_lock_symlink_warning', { count: fileLockPreview?.symlink_paths?.length || 0 })"></span>
                    <ul class="mt-1 ml-4 list-disc text-gray-300"><template x-for="path in (fileLockPreview?.symlink_paths || []).slice(0, 20)" :key="path"><li x-text="path"></li></template></ul>
                </div>
                <p x-show="fileLockPreview?.truncated" class="text-yellow-300" x-text="t('website.file_lock_preview_truncated')"></p>
                <p class="text-gray-500">{{t .Lang "website.file_lock_preview_disclaimer"}}</p>
            </div>

            <hr class="my-5 border-gray-700">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <label class="flex items-start space-x-2 text-sm text-gray-300" :class="site.file_lock_enabled ? 'cursor-not-allowed opacity-80' : 'cursor-pointer'">
                    <input type="checkbox" :checked="site.file_lock_enabled || disableFileEditing" @change="disableFileEditing = $event.target.checked" :disabled="site.file_lock_enabled || fileEditingSaving" class="mt-0.5">
                    <span>
                        <span class="block">{{t .Lang "website.disable_file_editing"}}</span>
                        <span class="block text-xs text-gray-500 mt-1">{{t .Lang "website.disable_file_editing_help"}}</span>
                        <span x-show="site.file_lock_enabled" class="block text-xs text-green-400 mt-1">{{t .Lang "website.disable_file_editing_managed"}}</span>
                    </span>
                </label>
                <button x-show="!site.file_lock_enabled" @click="saveFileEditingProtection()" :disabled="fileEditingSaving" class="btn-secondary text-sm whitespace-nowrap" x-text="fileEditingSaving ? t('common.saving') : t('website.save_file_editing')"></button>
            </div>

            <hr class="my-5 border-gray-700">
            <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
                <div class="flex-1">
                    <label class="block text-sm text-gray-300 font-medium mb-1">{{t .Lang "website.password_reset_mode"}}</label>
                    <span class="block text-xs text-gray-500 mb-2">{{t .Lang "website.password_reset_help"}}</span>
                    <select x-model="passwordResetMode" :disabled="passwordResetSaving" class="input-field w-full text-sm py-1.5 max-w-xs">
                        <option value="allow">{{t .Lang "website.password_reset_allow"}}</option>

                    </select>
                    <p x-show="passwordResetMode === 'all'" class="text-xs text-yellow-300 mt-2">{{t .Lang "website.password_reset_all_hides_link"}}</p>

            </div>

        </div>

    <!-- Row 3: 网站日志 -->
    <div class="mt-6">
        <div class="card">
            <h3 class="text-lg font-semibold text-white mb-4">{{t .Lang "website.site_logs"}}</h3>
            <div class="flex flex-wrap items-center gap-2 mb-3">
                <button @click="selectLogType('access')" :class="logType === 'access' ? 'text-white border-b-2 border-blue-400' : 'text-gray-400 hover:text-white'" class="px-3 py-1 text-sm font-medium">{{t .Lang "website.access_log"}}</button>
                <button @click="selectLogType('error')" :class="logType === 'error' ? 'text-white border-b-2 border-blue-400' : 'text-gray-400 hover:text-white'" class="px-3 py-1 text-sm font-medium">{{t .Lang "website.error_log"}}</button>
                <button x-show="site.site_type === 'wordpress'" @click="selectLogType('security')" :class="logType === 'security' ? 'text-white border-b-2 border-blue-400' : 'text-gray-400 hover:text-white'" class="px-3 py-1 text-sm font-medium">{{t .Lang "website.security_log"}}</button>
                <button @click="fetchLogs()" class="text-sm py-1 px-3 rounded text-gray-400 hover:text-white" style="background-color: #1e293b; border: 1px solid #334155;">{{t .Lang "website.refresh"}}</button>
                <button @click="clearLogs()" class="text-sm py-1 px-3 rounded" style="background-color: #7f1d1d; color: #fca5a5;">{{t .Lang "website.clear"}}</button>
                <button @click="logFullscreen = true" class="text-sm py-1 px-3 rounded text-gray-400 hover:text-white" style="background-color: #1e293b; border: 1px solid #334155;">{{t .Lang "website.fullscreen"}}</button>
                <button @click="downloadLogFile(currentLogFilename())" class="text-sm py-1 px-3 rounded text-gray-400 hover:text-white" style="background-color: #1e293b; border: 1px solid #334155;">{{t .Lang "website.download_current_full_log"}}</button>
				<a :href="(document.body.dataset.panelPrefix || '') + '/log-analysis?site_id=' + site.id" class="text-sm py-1 px-3 rounded inline-block" style="background-color: #14532d; color: #86efac;">{{t .Lang "website.analyze_logs"}}</a>
                <select @change="setAccessLogMode($event.target.value)" x-model="accessLogMode" x-show="logType === 'access'" class="input-field w-28 text-sm py-1">
                    <option value="off">{{t .Lang "website.access_log_off"}}</option>

                <select x-model.number="logLineLimit" @change="fetchLogs()" class="input-field w-28 text-sm py-1">
                    <option value="200">{{t .Lang "website.recent_200_lines"}}</option>
                    <option value="1000">{{t .Lang "website.recent_1000_lines"}}</option>
                    <option value="5000">{{t .Lang "website.recent_5000_lines"}}</option>

                <div class="flex items-center gap-1 text-sm text-gray-400 whitespace-nowrap">
                    <span>{{t .Lang "website.keep"}}</span>
                    <input type="number" x-model.number="logRetentionDays" @change="saveLogRetention()" class="input-field w-16 text-sm py-1 text-center" min="0" max="365">

            </div>

            <pre x-text="logContent" class="w-full rounded p-3 text-xs font-mono overflow-auto" style="background-color: #0f172a; border: 1px solid #334155; color: #94a3b8; max-height: 400px; white-space: pre-wrap; word-break: break-all;"></pre>
            <div class="mt-4">
                <div class="flex items-center justify-between mb-2">
                    <h4 class="text-sm font-medium text-white">{{t .Lang "website.history_log_download"}}</h4>
                    <button @click="fetchLogFiles()" class="text-xs py-1 px-2 rounded text-gray-400 hover:text-white" style="background-color: #1e293b; border: 1px solid #334155;">{{t .Lang "website.refresh_list"}}</button>

                    <table class="w-full text-sm">
                        <thead>

                                        <span x-show="file.current" class="badge-success">{{t .Lang "website.current"}}</span>
                                        <span x-show="!file.current && file.compressed" class="badge-info">{{t .Lang "website.compressed"}}</span>

                </div>

    <!-- 日志全屏弹窗 -->
    <div x-show="logFullscreen" class="fixed inset-0 bg-black bg-opacity-90 flex flex-col z-50" @keydown.escape.window="logFullscreen = false">
        <div class="flex items-center justify-between px-6 py-3 border-b border-gray-700">
            <div class="flex items-center space-x-4 text-sm">
                <span class="text-white font-semibold" x-text="logType === 'access' ? t('website.log_type_access') : (logType === 'security' ? t('website.log_type_security') : t('website.log_type_error'))"></span>
                <button @click="selectLogType('access')" :class="logType === 'access' ? 'text-white border-b-2 border-blue-400' : 'text-gray-400 hover:text-white'" class="px-3 py-1 text-sm font-medium">{{t .Lang "website.log_type_access"}}</button>
                <button @click="selectLogType('error')" :class="logType === 'error' ? 'text-white border-b-2 border-blue-400' : 'text-gray-400 hover:text-white'" class="px-3 py-1 text-sm font-medium">{{t .Lang "website.log_type_error"}}</button>
                <button x-show="site.site_type === 'wordpress'" @click="selectLogType('security')" :class="logType === 'security' ? 'text-white border-b-2 border-blue-400' : 'text-gray-400 hover:text-white'" class="px-3 py-1 text-sm font-medium">{{t .Lang "website.log_type_security"}}</button>
                <button @click="fetchLogs()" class="text-sm py-1 px-3 rounded text-gray-400 hover:text-white" style="background-color: #1e293b; border: 1px solid #334155;">{{t .Lang "website.refresh"}}</button>
                <select x-model.number="logLineLimit" @change="fetchLogs()" class="input-field w-28 text-sm py-1">
                    <option value="200">{{t .Lang "website.log_last_200"}}</option>

                <button @click="downloadLogFile(currentLogFilename())" class="text-sm py-1 px-3 rounded text-gray-400 hover:text-white" style="background-color: #1e293b; border: 1px solid #334155;">{{t .Lang "website.download_current_log"}}</button>
            </div>
            <button @click="logFullscreen = false" class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
        </div>
        <pre x-text="logContent" class="flex-1 w-full p-6 text-xs font-mono overflow-auto" style="background-color: #0a0e14; color: #94a3b8; white-space: pre-wrap; word-break: break-all;"></pre>
    </div>

    <!-- ============================================================ -->
    <!-- Modals -->
    <!-- ============================================================ -->

    <!-- 编辑域名 -->
    <div x-show="domainModalOpen" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50" @click.self="domainModalOpen = false">
        <div class="rounded-lg shadow-xl w-full max-w-md p-6" style="background-color: #1e293b; border: 1px solid #334155;">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-white">{{t .Lang "website.edit_domain"}}</h3>
                <button @click="domainModalOpen = false" class="text-gray-400 hover:text-white text-xl">&times;</button>
            </div>
            <div class="mb-3">
                <label class="block text-sm text-gray-300 mb-1">{{t .Lang "website.main_domain"}}</label>
                <input type="text" x-model="editDomain" class="w-full rounded p-2 text-sm font-mono" style="background-color: #0f172a; border: 1px solid #334155; color: #e2e8f0;">
            </div>
            <div class="mb-3">
                <label class="block text-sm text-gray-300 mb-1">{{t .Lang "website.aliases_one_per_line"}}</label>
                <textarea x-model="editAliasesStr" rows="4" class="w-full rounded p-2 text-sm font-mono" style="background-color: #0f172a; border: 1px solid #334155; color: #e2e8f0; resize: vertical;" placeholder="www.aaa.com&#10;blog.aaa.com"></textarea>
            </div>
            <div x-show="editDomain !== site.domain" class="mb-3 p-3 rounded text-sm" style="background-color: #422006; border: 1px solid #78350f; color: #fbbf24;">
                主域名变更后将重命名网站目录、日志目录、Nginx配置、PHP-FPM Pool及SSL证书目录。系统用户（<span x-text="site.system_user" class="font-mono"></span>）和数据库名保持不变。<span x-show="site.site_type === 'wordpress'">WordPress 站点 URL 可在数据库卡片内修改</span>
            </div>
            <p x-show="site.ssl_enabled" class="text-yellow-400 text-xs mb-3">修改域名后需重新申请 SSL 证书以匹配新域名。</p>
            <div class="flex justify-end space-x-3">
                <button @click="domainModalOpen = false" class="btn-secondary">{{t .Lang "common.cancel"}}</button>
                <button @click="updateDomains()" :disabled="domainSubmitting" class="btn-primary" x-text="domainSubmitting ? t('website.processing') : t('common.save')"></button>
            </div>
        </div>
    </div>

    <!-- SSL 证书 -->
    <div x-show="sslModalOpen" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50" @click.self="sslModalOpen = false">
        <div class="rounded-lg shadow-xl w-full max-w-2xl p-6" style="background-color: #1e293b; border: 1px solid #334155;">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-white">
                    <span x-show="!site.ssl_enabled">{{t .Lang "website.enable_ssl_for"}} <span x-text="site.domain"></span></span>
                    <span x-show="site.ssl_enabled && sslMode === 'auto'">{{t .Lang "website.reissue_ssl_for"}} <span x-text="site.domain"></span></span>
                    <span x-show="site.ssl_enabled && sslMode === 'manual'">{{t .Lang "website.replace_ssl_for"}} <span x-text="site.domain"></span></span>
                </h3>
                <button @click="sslModalOpen = false" class="text-gray-400 hover:text-white text-xl">&times;</button>
            </div>

            <div class="flex border-b border-gray-600 mb-4">
                <button @click="sslMode = 'auto'" :class="sslMode === 'auto' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-gray-400 hover:text-white'" class="px-4 py-2 text-sm font-medium">{{t .Lang "website.auto_ssl"}}</button>
                <button @click="sslMode = 'manual'" :class="sslMode === 'manual' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-gray-400 hover:text-white'" class="px-4 py-2 text-sm font-medium">{{t .Lang "website.manual_ssl"}}</button>
            </div>

            <div x-show="sslMode === 'auto'">
                <p class="text-gray-400 text-sm mb-4">{{t .Lang "website.auto_ssl_help"}}</p>
            </div>

            <div x-show="sslMode === 'manual'">
                <div class="mb-4">
                    <label class="block text-sm text-gray-300 mb-1">{{t .Lang "website.ssl_cert_content"}}</label>
                    <textarea x-model="sslCert" rows="6" class="w-full rounded p-3 text-sm font-mono" style="background-color: #0f172a; border: 1px solid #334155; color: #e2e8f0; resize: vertical;" placeholder="-----BEGIN CERTIFICATE-----&#10;...&#10;-----END CERTIFICATE-----"></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-sm text-gray-300 mb-1">{{t .Lang "website.ssl_key_content"}}</label>
                    <textarea x-model="sslKey" rows="6" class="w-full rounded p-3 text-sm font-mono" style="background-color: #0f172a; border: 1px solid #334155; color: #e2e8f0; resize: vertical;" placeholder="-----BEGIN PRIVATE KEY-----&#10;...&#10;-----END PRIVATE KEY-----"></textarea>
                </div>
            </div>

            <div class="flex justify-end space-x-3 mt-4">

            </div>
        </div>

    </div>
</template>

</div>

<script>
function websiteDetail() {
    return {
        site: null,
        loading: true,
        sslModalOpen: false,
        sslMode: 'auto',
        sslCert: '',
        sslKey: '',
        sslSubmitting: false,
        sslExportEnabled: false,
        sslExportSaving: false,
        logType: 'access',
        logContent: '',
        logLineLimit: 200,
        logFiles: [],
        logFullscreen: false,
        nginxPreContent: '',
        nginxContent: '',
        nginxSubmitting: false,
        fcacheEnabled: false,
        fcacheTTL: 300,
        disableWPUpdates: false,
        savedDisableWPUpdates: false,
        disableFileEditing: false,
        savedDisableFileEditing: false,
        fileEditingSaving: false,
        passwordResetMode: 'allow',
        passwordResetSaving: false,
        xmlrpcEnabled: false,
        wpDebug: false,
        wpPostRevisions: -1,
        wpMemoryLimit: '',
        logRetentionDays: 7,
        optimizationSaving: false,
        fileLockSaving: false,
        fileLockMode: 'standard',
        fileLockPreview: null,
        fileLockPreviewLoading: false,
        pluginStatus: 'not_installed',
        pluginInstalling: false,
        monitoringEnabled: false,
        monitoringInterval: 5,
        monitoringSaving: false,
        documentRootSubdir: '',
        documentRootSaving: false,
        cdnGroups: [],
        cdnRealIPEnabled: false,
        cdnRealIPGroupIDs: [],
        cdnRealIPSaving: false,
        accessLogMode: 'off',
        expiresAtInput: '',
        editingExpiry: false,
        expirySaving: false,
        domainModalOpen: false,
        editDomain: '',
        editAliasesStr: '',
        domainSubmitting: false,
        init() {
            this.fetchDetail();
        },
        async fetchDetail() {
            const id = window.location.pathname.split('/').pop();
            try {
                const r = await api('/websites/' + id);
                if (r.success) {
                    this.site = r.data;
                    this.fcacheEnabled = r.data.fastcgi_cache_enabled;
                    this.fcacheTTL = r.data.fastcgi_cache_ttl || 300;
                    this.disableWPUpdates = r.data.disable_wp_updates || false;
                    this.savedDisableWPUpdates = this.disableWPUpdates;
                    this.disableFileEditing = r.data.disable_file_editing || false;
                    this.savedDisableFileEditing = this.disableFileEditing;
                    this.passwordResetMode = r.data.password_reset_mode || 'allow';
                    this.xmlrpcEnabled = r.data.xmlrpc_enabled || false;
                    this.wpDebug = r.data.wp_debug_enabled || false;
                    this.wpPostRevisions = r.data.wp_post_revisions != null ? r.data.wp_post_revisions : -1;
                    this.wpMemoryLimit = r.data.wp_memory_limit || '';
                    this.logRetentionDays = r.data.log_retention_days || 7;
                    this.monitoringEnabled = r.data.monitoring_enabled || false;
                    this.monitoringInterval = r.data.monitoring_interval || 5;
                    this.documentRootSubdir = r.data.document_root_subdir || '';
                    this.cdnRealIPEnabled = r.data.cdn_realip_enabled || false;
                    this.cdnRealIPGroupIDs = (r.data.cdn_realip_groups || []).map(g => g.id);
                    this.sslExportEnabled = r.data.ssl_export_enabled || false;
                    this.fileLockMode = r.data.file_lock_mode === 'strict' ? 'strict' : 'standard';
                    this.fileLockPreview = null;
                }
            } catch(e) { showToast(t('website.load_failed_with_error', { error: e.message }), 'error'); }
            this.loading = false;
            Promise.allSettled([
                this.fetchNginxCustom(),
                this.fetchPluginStatus(),
                this.fetchCDNGroups()
            ]);
            deferTask(() => {
                this.fetchLogs();
                this.fetchLogFiles();
            }, 400);
        },
        async fetchCDNGroups() {
            try {
                const r = await api('/security/cdn-realip-groups');
                if (r.success) {
                    this.cdnGroups = r.data || [];
                    this.normalizeCDNRealIPSelection();
                }
            } catch(e) {}
        },
        selectableCDNGroups() {
            return this.cdnGroups.filter(g => g.provider !== 'cloudflare');
        },
        normalizeCDNRealIPSelection() {
            const currentIDs = this.cdnRealIPGroupIDs.map(id => parseInt(id));
            const selected = this.cdnGroups.filter(g => currentIDs.includes(g.id));
            const selectedNonCloudflareIDs = selected.filter(g => g.provider !== 'cloudflare').map(g => g.id);
            if (this.cdnRealIPEnabled && selected.length > 0 && selectedNonCloudflareIDs.length === 0) {
                this.cdnRealIPEnabled = false;
            }
            this.cdnRealIPGroupIDs = selectedNonCloudflareIDs;
        },
        normalizeCDNRealIPCompatibility(changedGroup) {
            if (!this.cdnRealIPGroupIDs.map(Number).includes(changedGroup.id)) return;
            const changedCompatible = !(changedGroup.ip_ranges || '').trim();
            this.cdnRealIPGroupIDs = this.cdnRealIPGroupIDs.filter(id => {
                const group = this.cdnGroups.find(g => g.id === Number(id));
                if (!group) return false;
                return changedCompatible ? group.id === changedGroup.id : (group.ip_ranges || '').trim();
            });
        },
        cdnRealIPModeText() {
            if (!this.cdnRealIPEnabled) return '';
            const currentIDs = this.cdnRealIPGroupIDs.map(id => parseInt(id));
            const selected = this.selectableCDNGroups().filter(g => currentIDs.includes(g.id));
            if (selected.length === 0) return t('website.cdn_select_non_cloudflare_help');
            const headers = [...new Set(selected.map(g => (g.header_name || '').toLowerCase()))];
            if (headers.length > 1) return t('website.cdn_header_mismatch');
            if (selected.some(g => !(g.ip_ranges || '').trim())) {
                return t('website.cdn_compatible_no_origin_ips');
            }
            return t('website.cdn_strict_origin_ips');
        },
        async saveCDNRealIP() {
            this.cdnRealIPSaving = true;
            try {
                const groupIDs = this.cdnRealIPGroupIDs.map(id => parseInt(id)).filter(id => this.selectableCDNGroups().some(g => g.id === id));
                if (this.cdnRealIPEnabled && groupIDs.length === 0) {
                    showToast(t('website.cdn_select_non_cloudflare_required'), 'error');
                    return;
                }
                const r = await api('/websites/' + this.site.id + '/cdn-realip', {
                    method: 'PUT',
                    body: { enabled: this.cdnRealIPEnabled, group_ids: groupIDs }
                });
                showToast(r.data?.message || t('website.cdn_realip_saved'), 'success');
                await this.fetchDetail();
            } catch(e) { showToast(e.message, 'error'); }
            finally { this.cdnRealIPSaving = false; }
        },
        async enableSSL() {
            if (this.sslMode === 'manual' && (!this.sslCert || !this.sslKey)) {
                showToast(t('website.ssl_manual_required'), 'error');
                return;
            }
            this.sslSubmitting = true;
            try {
                const body = { mode: this.sslMode };
                if (this.sslMode === 'manual') {
                    body.certificate = this.sslCert;
                    body.private_key = this.sslKey;
                }
                const r = await api('/websites/' + this.site.id + '/ssl', { method: 'POST', body });
                if (r.success) {
                    showToast(r.data?.message || t('common.operation_success'), 'success');
                    this.sslModalOpen = false;
                    await this.fetchDetail();
                } else {
                    showToast(r.data?.message || t('common.operation_failed'), 'error');
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
            this.sslSubmitting = false;
        },
        downloadSSLPackage() {
            if (!this.site || !this.site.ssl_enabled) return;
            const prefix = '/' + document.body.dataset.panelPrefix.replace('/', '');
            window.open(prefix + '/api/websites/' + this.site.id + '/ssl/download');
        },
        async saveSSLExport() {
            if (!this.site) return;
            this.sslExportSaving = true;
            try {
                const r = await api('/websites/' + this.site.id + '/ssl/export', {
                    method: 'PUT',
                    body: { enabled: this.sslExportEnabled }
                });
                showToast(r.data?.message || t('website.ssl_export_saved'), 'success');
                await this.fetchDetail();
            } catch(e) {
                this.sslExportEnabled = !this.sslExportEnabled;
                showToast(e.message, 'error');
            } finally {
                this.sslExportSaving = false;
            }
        },
        async updateDomains() {
            this.domainSubmitting = true;
            try {
                const newDomain = this.editDomain.trim();
                if (!newDomain) { showToast(t('website.domain_required'), 'error'); this.domainSubmitting = false; return; }
                const aliases = this.editAliasesStr.split('\n').map(a => a.trim()).filter(a => a);
                const body = { new_domain: newDomain, aliases };
                const r = await api('/websites/' + this.site.id + '/domains', { method: 'PUT', body });
                if (r.success) {
                    showToast(r.data?.message || t('website.updated'), 'success');
                    this.domainModalOpen = false;
                    await this.fetchDetail();
                } else {
                    showToast(r.data?.message || t('common.operation_failed'), 'error');
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
            this.domainSubmitting = false;
        },
        async removeSSL() {
            if (!await confirmModal(t('website.confirm_delete_ssl', { domain: this.site.domain }))) return;
            try {
                const r = await api('/websites/' + this.site.id + '/ssl', { method: 'DELETE' });
                if (r.success) {
                    showToast(r.data?.message || t('website.ssl_deleted'), 'success');
                    await this.fetchDetail();
                } else {
                    showToast(r.data?.message || t('common.operation_failed'), 'error');
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
        },
        async fetchNginxCustom() {
            try {
                const r = await api('/websites/' + this.site.id + '/nginx-custom');
                if (r.success) {
                    this.nginxPreContent = r.data.pre_content || '';
                    this.nginxContent = r.data.content || '';
                    this.accessLogMode = r.data.access_log_mode || 'off';
                }
            } catch(e) { /* 静默失败 */ }
        },
        async saveDocumentRoot() {
            if (!this.site || this.site.site_type !== 'php') return;
            this.documentRootSaving = true;
            try {
                const r = await api('/websites/' + this.site.id + '/document-root', {
                    method: 'PUT',
                    body: { document_root_subdir: this.documentRootSubdir }
                });
                if (r.success) {
                    showToast(r.data?.message || t('website.document_root_saved'), 'success');
                    await this.fetchDetail();
                } else {
                    showToast(r.data?.message || t('website.save_failed'), 'error');
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
            this.documentRootSaving = false;
        },
        async saveNginxCustom() {
            this.nginxSubmitting = true;
            try {
                const r = await api('/websites/' + this.site.id + '/nginx-custom', {
                    method: 'PUT',
                    body: { pre_content: this.nginxPreContent, content: this.nginxContent }
                });
                if (r.success) {
                    showToast(r.data?.message || t('common.saved'), 'success');
                } else {
                    showToast(r.data?.message || t('website.save_failed'), 'error');
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
            this.nginxSubmitting = false;
        },
        async fetchLogs() {
            if (!this.site) return;
            try {
                let url = '/websites/' + this.site.id + '/logs?type=' + this.logType + '&lines=' + encodeURIComponent(this.logLineLimit || 200);
                const r = await api(url);
                if (r.success) {
                    this.logContent = r.data.content;
                }
            } catch(e) { showToast(t('website.load_logs_failed', { error: e.message }), 'error'); }
        },
        async fetchLogFiles() {
            if (!this.site) return;
            try {
                const r = await api('/websites/' + this.site.id + '/log-files?type=' + this.logType);
                if (r.success) {
                    this.logFiles = r.data.files || [];
                }
            } catch(e) { showToast(t('website.load_log_files_failed', { error: e.message }), 'error'); }
        },
        selectLogType(type) {
            this.logType = type;
            this.fetchLogs();
            this.fetchLogFiles();
        },
        currentLogFilename() {
            if (this.logType === 'error') return 'error.log';
            if (this.logType === 'security') return 'wp-security.log';
            return 'access.log';
        },
        downloadLogFile(filename) {
            if (!this.site || !filename) return;
            const prefix = document.body.dataset.panelPrefix || '';
            window.open(prefix + '/api/websites/' + this.site.id + '/logs/download?type=' + encodeURIComponent(this.logType) + '&file=' + encodeURIComponent(filename));
        },
        async setAccessLogMode(mode) {
            try {
                const r = await api('/websites/' + this.site.id + '/access-log', { method: 'PUT', body: { mode } });
                if (r.success) {
                    this.accessLogMode = mode;
                    if (mode === 'off') {
                        this.logContent = '';
                    }
                    showToast(r.data?.message, 'success');
                } else {
                    showToast(r.data?.message || t('common.operation_failed'), 'error');
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
        },
        async clearLogs() {
            const label = this.logType === 'error' ? t('website.log_type_error') : (this.logType === 'security' ? t('website.log_type_security') : t('website.log_type_access'));
            if (!await confirmModal(t('website.confirm_clear_logs', { label }))) return;
            try {
                const r = await api('/websites/' + this.site.id + '/logs?type=' + this.logType, { method: 'DELETE' });
                if (r.success) {
                    showToast(t('website.logs_cleared'), 'success');
                    this.logContent = t('website.log_empty_or_missing');
                    this.fetchLogFiles();
                }
            } catch(e) { showToast(t('website.operation_failed_with_error', { error: e.message }), 'error'); }
        },
        async fetchPluginStatus() {
            try {
                const r = await api('/websites/' + this.site.id + '/install-plugin/status');
                if (r.success) this.pluginStatus = r.data.status;
            } catch(e) {}
        },
        async installPlugin() {
            this.pluginInstalling = true;
            try {
                const r = await api('/websites/' + this.site.id + '/install-plugin', { method: 'POST' });
                showToast(r.data?.message || t('website.installed'), 'success');
                await this.fetchPluginStatus();
            } catch(e) { showToast(e.message, 'error'); }
            this.pluginInstalling = false;
        },
        fileLockStatusText() {
            if (this.fileLockApplyIncomplete()) return t('website.file_lock_apply_failed');
            if (!this.site.file_lock_enabled) return t('website.file_unlocked');
            if (this.site.file_lock_mode === 'legacy') return t('website.file_lock_legacy');
            return this.site.file_lock_mode === 'strict' ? t('website.file_lock_strict') : t('website.file_lock_standard');
        },
        fileLockApplyIncomplete() {
            return this.site.file_lock_apply_status === 'failed' || this.site.file_lock_apply_status === 'applying';
        },
        fileLockDisplayPath(path) {
            const labels = {
                'wp-content/uploads': t('website.file_lock_path_uploads'),
                'wp-content/cache': t('website.file_lock_path_cache'),
                'wp-content/wflogs': t('website.file_lock_path_wflogs'),
                'wp-content/languages': t('website.file_lock_path_languages'),
                'wp-content/plugins': t('website.file_lock_path_plugins'),
                'wp-content/themes': t('website.file_lock_path_themes'),
                'wp-content/mu-plugins': t('website.file_lock_path_mu_plugins'),
                'wp-config.php': t('website.file_lock_path_wp_config'),
                '.user.ini': t('website.file_lock_path_user_ini'),
                'php.ini': t('website.file_lock_path_php_ini'),
                'wordfence-waf.php': t('website.file_lock_path_wordfence_waf'),
                'wp-content/advanced-cache.php': t('website.file_lock_path_advanced_cache'),
                'wp-content/object-cache.php': t('website.file_lock_path_object_cache'),
                'wp-content/db.php': t('website.file_lock_path_db_dropin'),
                'wp-content/sunrise.php': t('website.file_lock_path_sunrise')
            };
            return labels[path] || path;
        },
        async loadFileLockPreview() {
            if (!this.site?.id) return null;
            this.fileLockPreviewLoading = true;
            try {
                const r = await api('/websites/' + this.site.id + '/file-lock/preview?mode=' + encodeURIComponent(this.fileLockMode));
                this.fileLockPreview = r.data || null;
                return this.fileLockPreview;
            } catch(e) {
                showToast(e.message, 'error');
                return null;
            } finally {
                this.fileLockPreviewLoading = false;
            }
        },
        async applyFileLock(enabled) {
            let prompt = t('website.file_lock_disable_confirm');
            if (enabled) {
                const preview = await this.loadFileLockPreview();
                if (!preview) return;
                prompt = t('website.file_lock_apply_confirm', {
                    mode: this.fileLockMode === 'strict' ? t('website.file_lock_mode_strict') : t('website.file_lock_mode_standard'),
                    readonly: (preview.read_only_dirs || []).length,
                    executable: (preview.executable_files || []).length,
                    symlink: (preview.symlink_paths || []).length
                });
            }
            if (!await confirmModal(prompt)) return;
            this.fileLockSaving = true;
            try {
                const r = await api('/websites/' + this.site.id + '/file-lock', {
                    method: 'PUT',
                    body: { enabled, mode: enabled ? this.fileLockMode : '' }
                });
                this.site.file_lock_enabled = r.data?.file_lock_enabled ?? enabled;
                this.site.file_lock_mode = r.data?.file_lock_mode || '';
                this.site.file_lock_apply_status = r.data?.file_lock_apply_status || '';
                showToast(r.data?.message || (enabled ? t('website.file_lock_enabled') : t('website.file_lock_disabled')), 'success');
            } catch(e) {
                const selectedMode = this.fileLockMode;
                showToast(e.message, 'error');
                await this.fetchDetail();
                this.fileLockMode = selectedMode;
            }
            this.fileLockSaving = false;
        },
        async saveMonitoring() {
            this.monitoringSaving = true;
            try {
                await api('/websites/' + this.site.id + '/monitoring', {
                    method: 'PUT',
                    body: { enabled: this.monitoringEnabled, interval: parseInt(this.monitoringInterval) || 5 }
                });
                showToast(t('website.monitoring_saved'), 'success');
            } catch(e) { showToast(t('website.save_failed_with_error', { error: e.message }), 'error'); }
            this.monitoringSaving = false;
        },
        async saveExpiry() {
            this.expirySaving = true;
            try {
                await api('/websites/' + this.site.id + '/expiry', {
                    method: 'PUT',
                    body: { expires_at: this.expiresAtInput }
                });
                this.site.expires_at = this.expiresAtInput || null;
                this.editingExpiry = false;
                showToast(t('website.expiry_saved'), 'success');
            } catch(e) { showToast(t('website.save_failed_with_error', { error: e.message }), 'error'); }
            this.expirySaving = false;
        },
        async saveWPOptimizations() {
            this.optimizationSaving = true;
            try {
                await api('/websites/' + this.site.id + '/wp-optimizations', {
                    method: 'PUT',
                    body: {
                        fcache_enabled: this.fcacheEnabled,
                        fcache_ttl: parseInt(this.fcacheTTL) || 300,
                        disable_wp_updates: this.disableWPUpdates,
                        expected_disable_wp_updates: this.savedDisableWPUpdates,
                        disable_file_editing: this.disableFileEditing,
                        xmlrpc_enabled: this.xmlrpcEnabled,
                        wp_debug_enabled: this.wpDebug,
                        wp_post_revisions: this.wpPostRevisions,
                        wp_memory_limit: this.wpMemoryLimit
                    }
                });
                this.savedDisableWPUpdates = this.disableWPUpdates;
                showToast(t('website.optimization_saved'), 'success');
            } catch(e) { showToast(t('website.save_failed_with_error', { error: e.message }), 'error'); }
            this.optimizationSaving = false;
        },
        async saveFileEditingProtection() {
            if (this.site.file_lock_enabled) return;
            this.fileEditingSaving = true;
            try {
                const r = await api('/websites/' + this.site.id + '/file-editor', {
                    method: 'PUT',
                    body: { enabled: this.disableFileEditing }
                });
                this.disableFileEditing = r.data?.disable_file_editing ?? this.disableFileEditing;
                this.savedDisableFileEditing = this.disableFileEditing;
                showToast(r.data?.message || t('website.file_editing_saved'), 'success');
            } catch(e) {
                this.disableFileEditing = this.savedDisableFileEditing;
                showToast(e.message, 'error');
            }
            this.fileEditingSaving = false;
        },
        async savePasswordReset() {
            this.passwordResetSaving = true;
            try {
                const r = await api('/websites/' + this.site.id + '/password-reset', {
                    method: 'PUT',
                    body: { mode: this.passwordResetMode }
                });
                this.passwordResetMode = r.data?.password_reset_mode ?? this.passwordResetMode;
                showToast(r.data?.message || t('website.password_reset_saved'), 'success');
            } catch(e) { showToast(e.message, 'error'); }
            this.passwordResetSaving = false;
        },
        async saveLogRetention() {
            try {
                await api('/websites/' + this.site.id + '/log-retention', {
                    method: 'PUT',
                    body: { retention_days: parseInt(this.logRetentionDays) || 0 }
                });
            } catch(e) {}
        },
        async clearFCache() {
            if (!await confirmModal(t('website.confirm_clear_cache'))) return;
            try {
                await api('/websites/' + this.site.id + '/cache', { method: 'DELETE' });
                showToast(t('website.cache_cleared'), 'success');
            } catch(e) { showToast(e.message, 'error'); }
        },
    }
}
</script>
