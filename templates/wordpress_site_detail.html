{{template "base" .}}
{{define "wordpress_site_detail_content"}}
<div x-data="wordpressSiteDetail()" x-init="init()">
    <div class="mb-6 flex items-center justify-between gap-4">
        <div>
            <h2 class="text-xl font-bold text-white">{{t .Lang "wp_inventory.title"}}</h2>
            <p x-show="site" class="mt-1 text-sm text-gray-400" x-text="site?.domain"></p>
        </div>
        <a href="/{{.RandomSuffix}}/wordpress-overview" class="btn-secondary">{{t .Lang "wp_inventory.back_to_overview"}}</a>
    </div>

    <div x-show="loading" class="py-8 text-center text-sm text-gray-400">{{t .Lang "website.loading"}}</div>
    <div x-show="error" class="card py-8 text-center text-sm text-red-300" x-text="error"></div>

    <template x-if="site && site.site_type === 'wordpress'">
        <div>
            {{template "wp_core_update_panel" .}}
            {{template "wp_inventory_panel" .}}
        </div>
    </template>
</div>

<script>
function wordpressSiteDetail() {
    return {
        site: null,
        loading: true,
        error: '',
        async init() {
            const parts = window.location.pathname.split('/').filter(Boolean);
            const siteID = parts.length >= 2 ? parts[parts.length - 2] : '';
            try {
                const response = await api('/websites/' + encodeURIComponent(siteID));
                if (!response.success || !response.data) throw new Error(t('common.request_failed'));
                if (response.data.site_type !== 'wordpress') throw new Error(t('wp_inventory.wordpress_only'));
                this.site = response.data;
            } catch (error) {
                this.error = error && error.message ? error.message : t('common.request_failed');
            } finally {
                this.loading = false;
            }
        },
    };
}
</script>
{{end}}
